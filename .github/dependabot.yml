version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions (React 19, Vite 8...) break the 3D libraries; those are upgraded by hand.
    # Security fixes still arrive through Dependabot security updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The 3D stack must move together (tested by hand): three 0.187 + postprocessing 2.19 blanks the game.
      - dependency-name: "three"
      - dependency-name: "@types/three"
      - dependency-name: "@react-three/*"
      - dependency-name: "postprocessing"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
